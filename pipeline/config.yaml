# Parts of this file were generated with AI assistance (Claude Code). See docs/AI_USAGE.md
#
# CLEAR pipeline configuration. Every parameter says where its value comes from.
# Paths are relative to the repository root (run the pipeline from there).

# Zones processed by default, in order. The first one is the primary zone: it is exported to web/public/data/
# (as before); the others go to web/public/data/zones/<id>/. web/public/data/zones.json lists them all.
zones: [boqueron-norte, boqueron-sur, neembucu, mbaracayu]

aois:
  # [lon_min, lat_min, lon_max, lat_max], EPSG:4326
  chaco-central-norte:
    # Chapter 1 until 2026-11-14 afternoon (see boqueron-norte). Moved on 2026-11-14 from [-61.0, -21.95, -60.4, -21.55], where OPERA DIST-ALERT (22 ha) and NISAR (~86 ha)
    # saw almost no clearing in Jun-Oct 2026. This box had 319 ha of confirmed >=50% DIST-ALERT loss and lies inside
    # track 161 / frame 167 (checked against the product footprint). Chosen over boxes further north (PNCAT risk).
    bbox: [-60.78, -21.73, -60.18, -21.33]
  boqueron-norte:
    # Chapter 1 since 2026-11-14 (afternoon). Found with a NISAR frequency-B (80 m) scan of the whole frame 167:
    # forest in Nov-Dec 2025 that was open in Sep-Oct 2026, with new paddock blocks visible (about 950 ha, coarse).
    # In chaco-central-norte the radar found almost no new clearing (5 ha), only management of existing paddocks.
    # Ethics: one district only (Mariscal Estigarribia, Boqueron); 139 km from the district of Puerto Casado (ex La Victoria),
    # Alto Paraguay, where the PNCAT is located (Resolucion N.o 1/2001, Direccion General de Bienes Culturales, MEC).
    # Published as aggregated hexagons, not exact polygons. Fully inside track 161 / frame 167.
    bbox: [-61.6, -20.9, -61.0, -20.5]
    kind: clearing
    chapter: 1
    name: {es: "Norte de Boquerón", en: "Northern Boquerón"}
    orbit: {relative_orbit: 161, flight_direction: ASCENDING, frame: 167}
    expected_dates: [2025-11-21, 2025-12-03, 2025-12-15, 2025-12-27, 2026-01-08, 2026-01-20, 2026-02-01, 2026-02-13,
                     2026-02-25, 2026-03-09, 2026-03-21, 2026-04-02, 2026-04-26, 2026-05-08, 2026-05-20, 2026-06-01,
                     2026-06-13, 2026-06-25, 2026-07-07, 2026-07-19, 2026-08-24, 2026-09-05, 2026-09-17, 2026-09-29,
                     2026-10-11, 2026-10-23]
  boqueron-sur:
    # Second clearing zone (2026-11-14). NISAR frequency-B scan of frame 166: new paddock blocks, ~1,200 ha (coarse).
    # District of Mariscal Estigarribia, 133 km from the district of Puerto Casado (PNCAT). Frame 166 has 12 dates
    # with a gap from 2026-01-08 to 2026-06-25, so the baseline is the 2 dates before the gap.
    bbox: [-61.7, -22.8, -61.1, -22.4]
    kind: clearing
    chapter: 1
    name: {es: "Sur de Boquerón", en: "Southern Boquerón"}
    orbit: {relative_orbit: 161, flight_direction: ASCENDING, frame: 166}
    detection: {baseline_dates: 2}
  neembucu:
    # Chapter 2 (water). Track 10 descending, frame 102 (Jun - Oct 2026). Track 60 ascending, frame 164 was tried first:
    # its 2026-07-12 product is empty and 2026-07-24 striped (gain off by -20 / +12 dB), and in 2026-06-18 / 06-30 the
    # Paraguay river does not look like water; frame 102 is consistent on every date (checked 2026-11-14).
    bbox: [-57.9, -27.3, -57.3, -26.6]
    kind: water
    chapter: 2
    name: {es: "Ñeembucú", en: "Ñeembucú"}
    orbit: {relative_orbit: 10, flight_direction: DESCENDING, frame: 102}
  mbaracayu:
    # Chapter 3 (control: forest that should not change). The CLAUDE.md box [-55.7, -24.3, -55.2, -23.9] does not fit
    # inside any single frame; shifted 0.1 deg south to fit track 82 descending, frame 101 (11 dates, Jun - Oct 2026).
    bbox: [-55.7, -24.4, -55.2, -24.0]
    kind: control
    chapter: 3
    name: {es: "Mbaracayú", en: "Mbaracayú"}
    orbit: {relative_orbit: 82, flight_direction: DESCENDING, frame: 101}

nisar:
  # Search parameters (asf_search); values checked in ASF Vertex on 2026-11-14
  dataset: NISAR
  processing_level: GCOV
  production_configuration: PR
  relative_orbit: 161
  flight_direction: ASCENDING
  frame: 167
  start: "2025-11-01" # extended on 2026-11-14 from 2026-06-01: clearing in C happened before June, so the baseline must start earlier
  end: "2026-10-31"
  # GCOV grid to read: frequency A = 20 MHz, ~20 m pixels
  frequency: frequencyA
  polarizations: [HHHH, HVHV]
  # Composite Release ID -> product maturity (collection names in CLAUDE.md §8.1)
  crid_maturity:
    P05023: PROVISIONAL # NISAR_L2_GCOV_PROVISIONAL_V1
    P05036: VALIDATED # NISAR_L2_GCOV_V1
    X05009: BETA # NISAR_L2_GCOV_BETA_V1 (not calibrated)
    X05010: BETA # NISAR_L2_GCOV_BETA_V1 (not calibrated)
  # expected_dates: per zone (aois.<id>.expected_dates), used only to warn

paths:
  raw: data/raw # never committed
  interim: data/interim # crops and the scene manifest; not committed
  web_data: web/public/data # pipeline outputs read by the web app

export:
  rgb_res_deg: 0.0005 # ~50 m; 1200 x 800 px for chaco-central-norte. 20 m would be too heavy for phones
  rgb_webp_quality: 80 # ~250 KB per date vs 2.1 MB as PNG (team decision, 2026-11-14)
  rgb_percentiles: [2, 98] # stretch limits per channel, pooled over all dates (one stretch for the whole time-lapse)
  hex_width_m: 1000 # published clearing is aggregated into hexagons this wide (~87 ha); exact polygons stay in data/interim
  grid_nx: 125 # grid_500m.json: 0.6 deg / 125 = 0.0048 deg, about 500 m
  grid_ny: 89 # 0.4 deg / 89 = 0.0045 deg, about 500 m

detection:
  speckle_window: 5 # 5 x 5 pixels = 100 m at 20 m
  baseline_dates: 3 # Nov 21, Dec 3, Dec 15 (2025)
  min_baseline_db: -2.0 # pixel must look like forest to the radar on EVERY baseline date (normalized HV).
                        # History (2026-11-14): -3 on the median, then -4 on the median. A colour (HLS) check showed that
                        # -4 let through paddocks with regrowth, crops at peak biomass and pivots; their "clearing" was
                        # ploughing, burning or harvest of land already open in Nov 2025. Stricter: -2 on all dates.
  forest_mask: worldcover # worldcover (ESA WorldCover 2021) | gfc (UMD Global Forest Change 2000-2024, US); gfc not run yet
  gfc_min_treecover: 30 # % canopy in 2000 for the gfc mask (Global Forest Watch default)
  threshold_db: -3.0 # starting point; the ASF NISAR Cookbook example uses -2 dB
  persistence: 2 # dates below threshold needed within the window; avoids one-date drops (rain, noise)
  persistence_window: 3 # 2 of 3: tolerates one wet date that bounces bare soil back (e.g. 2026-04-26)
  min_area_ha: 5 # matches the DIST-ALERT comparison filter
  normalize: forest_median # per-date median HV of forest pixels in the AOI

quality:
  max_ref_deviation_db: 4.0 # drop a date whose forest HV median is this far from the zone's median of all dates
                            # (whole-scene jumps of 9-20 dB seen in Neembucu T60A F164, July 2026: product problems)

water:
  # Chapter 2 thresholds (dB, on the 50 m speckle-filtered grid). Estimates checked by eye on 2026-11-14
  # (river and lagoons as open water; esteros as flooded vegetation); results are labelled "estimado".
  open_water_hh_db: -18.0
  open_water_hv_db: -24.0
  flooded_hh_db: -4.0
  flooded_ratio_db: 10.0

validation:
  reference_statuses: [6, 8] # DIST-ALERT confirmed >=50% vegetation loss (ongoing, finished)
  tol_days: 24 # CLAUDE.md: same window +-24 days
  min_alert_area_ha: 5 # optical patches smaller than this are ignored for coverage
  polygon_confirmed_frac: 0.2 # dist_confirmed = true if >= 20% of the polygon has an optical alert
