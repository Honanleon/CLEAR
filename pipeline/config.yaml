# CLEAR pipeline configuration. Every parameter says where its value comes from.
# Paths are relative to the repository root (run the pipeline from there).

aoi: boqueron-norte # active AOI for this run

aois:
  # [lon_min, lat_min, lon_max, lat_max], EPSG:4326
  chaco-central-norte:
    # Chapter 1 until 2026-11-14 afternoon (see boqueron-norte). Moved on 2026-11-14 from [-61.0, -21.95, -60.4, -21.55], where OPERA DIST-ALERT (22 ha) and NISAR (~86 ha)
    # saw almost no clearing in Jun-Oct 2026. This box had 319 ha of confirmed >=50% DIST-ALERT loss and lies inside
    # track 161 / frame 167 (checked against the product footprint). Chosen over boxes further north (PNCAT risk).
    bbox: [-60.78, -21.73, -60.18, -21.33]
  boqueron-norte:
    # Chapter 1 since 2026-11-14 (afternoon). Found with a NISAR frequency-B (80 m) scan of the whole frame 167:
    # forest in Nov-Dec 2025 that was open in Sep-Oct 2026, with new paddock blocks visible (about 950 ha, coarse).
    # In chaco-central-norte the radar found almost no new clearing (5 ha), only management of existing paddocks.
    # Ethics: one district only (Mariscal Estigarribia, Boqueron); 139 km from the district of Puerto Casado (ex La Victoria),
    # Alto Paraguay, where the PNCAT is located (Resolucion N.o 1/2001, Direccion General de Bienes Culturales, MEC).
    # Published as aggregated hexagons, not exact polygons. Fully inside track 161 / frame 167.
    bbox: [-61.6, -20.9, -61.0, -20.5]
  neembucu:
    bbox: [-57.9, -27.3, -57.3, -26.6] # Chapter 2; orbit not verified yet
  mbaracayu:
    bbox: [-55.7, -24.3, -55.2, -23.9] # Chapter 3; orbit not chosen yet

nisar:
  # Search parameters (asf_search); values checked in ASF Vertex on 2026-11-14
  dataset: NISAR
  processing_level: GCOV
  production_configuration: PR
  relative_orbit: 161
  flight_direction: ASCENDING
  frame: 167
  start: "2025-11-01" # extended on 2026-11-14 from 2026-06-01: clearing in C happened before June, so the baseline must start earlier
  end: "2026-10-31"
  # GCOV grid to read: frequency A = 20 MHz, ~20 m pixels
  frequency: frequencyA
  polarizations: [HHHH, HVHV]
  # Composite Release ID -> product maturity (collection names in CLAUDE.md §8.1)
  crid_maturity:
    P05023: PROVISIONAL # NISAR_L2_GCOV_PROVISIONAL_V1
    P05036: VALIDATED # NISAR_L2_GCOV_V1
  # Dates we expect after de-duplication (ASF Vertex and asf_search, 2026-11-14). Used only to warn.
  expected_dates:
    - "2025-11-21"
    - "2025-12-03"
    - "2025-12-15"
    - "2025-12-27"
    - "2026-01-08"
    - "2026-01-20"
    - "2026-02-01"
